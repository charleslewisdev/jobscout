services:
  jobscout:
    build: .
    container_name: jobscout
    ports:
      - "${PORT:-3080}:3080"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # FlareSolverr and Chrome CDP are already running as separate
    # containers on unRAID — ensure network connectivity.
    # On unRAID, containers on the same custom network or bridge
    # can reach each other by container name.
